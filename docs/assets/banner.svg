<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="DODTH — Document Utility Suite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1023"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="round"><rect width="1280" height="420" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- sweeping scan line -->
    <rect y="0" width="140" height="420" fill="url(#accent)" opacity="0.12" filter="url(#soft)">
      <animate attributeName="x" values="-300;1500" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- brand tile with pulsing rings -->
    <circle cx="150" cy="210" r="74" fill="none" stroke="#818CF8" stroke-width="3" opacity="0.6">
      <animate attributeName="r" values="64;108" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="210" r="74" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="64;120" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="92" y="152" width="116" height="116" rx="24" fill="url(#tile)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M124 236 L124 194 L146 176 L176 176 L176 236 Z" fill="#FFFFFF" stroke="none" opacity="0.96"/>
      <path d="M146 176 L146 194 L176 194" stroke="#C7D2FE" stroke-width="6"/>
      <path d="M136 212 H164 M136 224 H164 M136 236 H156" stroke="#4338CA" stroke-width="4.5"/>
    </g>

    <!-- headline -->
    <text x="268" y="196" font-family="Verdana, Segoe UI, sans-serif" font-size="86" font-weight="800"
          fill="#FFFFFF" letter-spacing="2">DODTH</text>
    <text x="270" y="240" font-family="Verdana, Segoe UI, sans-serif" font-size="19" font-weight="700"
          fill="#A5B4FC" letter-spacing="7.5">DOCUMENT UTILITY SUITE</text>
    <text x="270" y="286" font-family="Verdana, Segoe UI, sans-serif" font-size="16"
          fill="#C7D2FE">Convert, merge, compress and protect — PDFs, Word, Excel and PowerPoint</text>

    <!-- animated underline -->
    <rect x="270" y="308" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="80;420;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="270;170;270" dur="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- floating documents -->
    <g opacity="0.95">
      <g>
        <rect x="872" y="88" width="92" height="122" rx="12" fill="#EEF2FF"/>
        <path d="M936 88 L964 116 L936 116 Z" fill="#C7D2FE"/>
        <path d="M892 152 H944 M892 176 H944 M892 200 H928" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 0" dur="3.4s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.85">
        <rect x="1016" y="150" width="74" height="98" rx="10" fill="#E0E7FF"/>
        <path d="M1062 150 L1090 178 L1062 178 Z" fill="#A5B4FC"/>
        <path d="M1032 208 H1076 M1032 228 H1076" stroke="#4338CA" stroke-width="5.5" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -26; 0 0" dur="4.1s" begin="0.7s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.7">
        <rect x="792" y="238" width="66" height="88" rx="9" fill="#C7D2FE"/>
        <path d="M812 278 H840 M812 296 H840" stroke="#3730A3" stroke-width="5" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="2.9s" begin="1.3s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="636" y="392" font-family="Verdana, Segoe UI, sans-serif" font-size="12"
          fill="#818CF8" letter-spacing="3" opacity="0.9">WEB · ANDROID · PRIVACY FIRST</text>
  </g>
</svg>
